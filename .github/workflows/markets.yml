name: Refresh market data

on:
  schedule:
    - cron: "47 13 * * *"  # 19:17 IST: after NSE publishes the day's close files
    - cron: "37 2 * * *"   # 08:07 IST: after Nasdaq after-hours trading ends
    # Odd minutes on purpose: GitHub delays runs scheduled on the hour the most.
    # A market that is trading when a run starts keeps its last close.
  workflow_dispatch:        # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: markets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch NIFTY 50 and Nasdaq-100 end-of-day data
        run: python -I scripts/fetch_markets.py
      - name: Save if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add markets.json markets.js
          git diff --cached --quiet || { git commit -m "Refresh market data" && git push; }
