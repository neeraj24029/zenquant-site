name: Refresh market data

on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST daily, after the US close
  workflow_dispatch:        # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: markets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch NIFTY 50 and Nasdaq-100 end-of-day data
        run: python -I scripts/fetch_markets.py
      - name: Save if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add markets.json markets.js
          git diff --cached --quiet || { git commit -m "Refresh market data" && git push; }
      - name: Telegram alert on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then echo "Telegram secrets not set; skipping alert"; exit 0; fi
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=⚠️ ZenQuant site: market data refresh failed. The site keeps the last good data; sections hide after 4 days without an update. Details: ${RUN_URL}" > /dev/null
